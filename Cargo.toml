[workspace]
resolver = "2"
members = ["crates/acswi-core", "crates/acswi-cli", "apps/acswi-desktop"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
acswi-core = { path = "crates/acswi-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
