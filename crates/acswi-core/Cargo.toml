[package]
name = "acswi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Engine for acswi: app definitions, encrypted vault and account switching"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
chrono.workspace = true
rmp-serde = "1"
serde_bytes = "0.11"
globset = "0.4"
getrandom = "0.2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
chacha20poly1305 = "0.10"

# The vault key goes in the desktop keyring when there is one.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
