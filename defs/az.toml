# Azure CLI keeps every signed-in user; `az account set` picks the active one.
# On Windows the tokens live in the Web Account Manager (device-bound), on Linux in
# ~/.azure. They are never copied - acswi only selects the account.
id = "az"
name = "Azure CLI"
strategy = "native"
detect = ["az"]
login = ["az", "login", "--allow-no-subscriptions"]
# az's interactive tenant/subscription picker waits for input and crashes on
# tenants that need MFA; `acswi add az NAME -- --tenant ID` signs in to one tenant.
login_env = { AZURE_CORE_LOGIN_EXPERIENCE_V2 = "off" }
notes = "A profile is a user; switching selects that user's first subscription."

[expiry]
# Microsoft Entra refresh tokens stop working after 90 days without use.
idle_days = 90

[native]
# Reading the profile file directly is much faster than `az account list`.
list_file = "~/.azure/azureProfile.json"
items = "/subscriptions"
account = "/user/name"
active = "/isDefault"
value = "/id"
switch = ["az", "account", "set", "--subscription", "{value}"]
