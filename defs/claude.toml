# Claude Code (standalone CLI) keeps one account: OAuth tokens under claudeAiOauth in
# ~/.claude/.credentials.json and the account record in ~/.claude.json. Only those keys
# are swapped: sign-ins to remote MCP servers (mcpOAuth in the same file) stay put, and
# `acswi mcp` can give them accounts of their own.
# Sessions inside the Claude desktop app sign in through the desktop app and
# are not affected by switching. On macOS the tokens are in the Keychain instead,
# so this definition is for Windows and Linux.
id = "claude"
name = "Claude Code"
strategy = "swap"
platforms = ["windows", "linux"]
detect = ["claude"]
processes = ['*\.local\bin\claude.exe']
login = ["claude", "auth", "login"]
notes = "Close terminal Claude Code sessions before switching. Desktop app sessions are not affected."

[os.linux]
# The native installer runs ~/.local/share/claude/versions/<version>.
processes = ['*/.local/share/claude/versions/*']

[identity]
command = ["claude", "auth", "status", "--json"]
pointer = "/email"

[expiry]
# The refresh token's own expiry date; Claude Code moves it on when it refreshes.
file = "~/.claude/.credentials.json"
pointer = "/claudeAiOauth/refreshTokenExpiresAt"

# Profiles saved by acswi 0.2 kept the whole file; acswi takes this key out of those.
[[state]]
kind = "json_key"
path = "~/.claude/.credentials.json"
keys = ["/claudeAiOauth"]

[[state]]
kind = "json_key"
path = "~/.claude.json"
keys = ["/oauthAccount"]
