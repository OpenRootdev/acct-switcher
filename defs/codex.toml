# Codex CLI keeps its sign-in in ~/.codex/auth.json (default file storage).
id = "codex"
name = "Codex CLI"
strategy = "swap"
detect = ["codex"]
processes = ["codex.exe"]
login = ["codex", "login"]
notes = "Assumes file credential storage (the default). With cli_auth_credentials_store = \"keyring\", add a credential item."

[os.linux]
processes = ["codex"]
notes = "Assumes file credential storage (the default)."

[[state]]
kind = "file"
path = "~/.codex/auth.json"
