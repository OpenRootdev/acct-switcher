# Discord (Electron) keeps its session token in Local Storage, encrypted with a
# key that only this Windows user on this PC can unlock. Discord hides to the
# tray when closed, so acswi force-closes it after a short wait.
id = "discord"
name = "Discord"
strategy = "swap"
detect = ['%LOCALAPPDATA%\Discord\Update.exe']
processes = ["Discord.exe"]
launch = ['%LOCALAPPDATA%\Discord\Update.exe', "--processStart", "Discord.exe"]
notes = "Profiles only work on this PC and Windows user (Electron safeStorage)."

[[state]]
kind = "dir"
path = '%APPDATA%\discord\Local Storage'
mode = "move"

# The .deb and .tar.gz builds; Flatpak keeps its data under ~/.var/app instead.
[os.linux]
detect = ["discord", "/usr/share/discord/Discord"]
processes = ["Discord"]
launch = ["discord"]
notes = "Profiles only work for this Linux user, whose keyring holds Discord's encryption key."

[[os.linux.state]]
kind = "dir"
path = "~/.config/discord/Local Storage"
mode = "move"
