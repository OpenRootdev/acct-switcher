# GitHub CLI keeps several accounts per host itself (gh 2.40+), so acct only
# calls `gh auth switch`. Tokens stay where gh keeps them (Credential Manager).
id = "gh"
name = "GitHub CLI"
strategy = "native"
detect = ["gh"]
login = ["gh", "auth", "login", "--hostname", "github.com", "--web", "--git-protocol", "https"]
notes = "git over HTTPS follows the active gh account if you ran `gh auth setup-git`."

[native]
list = ["gh", "auth", "status", "--json", "hosts"]
items = "/hosts/github.com"
account = "/login"
active = "/active"
switch = ["gh", "auth", "switch", "--hostname", "github.com", "--user", "{value}"]
